[include mainsail.cfg]

[virtual_sdcard]
path: /home/chris/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#####################################################################
# Ender 5 Plus + BLTouch + BIGTREETECH SKR Mini E3 V3.0 (Klipper)
# Bed: 350x350x400
#
# Notes:
# - Ender 5 Plus uses TR8x4 lead screws => stepper_z rotation_distance = 4
# - Dual Z motors are assumed wired in parallel to the single Z driver
# - BLTouch offsets + z_offset must be calibrated for YOUR mount/printer
#####################################################################

[mcu]
# Use: ls /dev/serial/by-id/ and paste your path here
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_26002D0008504E5238363120-if00
# restart_method: command

[printer]
kinematics: cartesian
#max_velocity: 250
max_velocity: 50
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100


#####################################################################
# Steppers (pins from BTT SKR Mini E3 V3.0 Klipper reference config)
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: -8
position_min: -8
position_max: 350
#homing_speed: 50
homing_speed: 40
second_homing_speed: 3

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.50
hold_current: 0.45
stealthchop_threshold: 999999


[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -10
position_min: -10
position_max: 350
#homing_speed: 50
homing_speed: 40
second_homing_speed: 3

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.50
hold_current: 0.45
stealthchop_threshold: 999999


# Z homes with the probe (BLTouch). Ender 5 Plus TR8x4 => rotation_distance 4
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -2.3
position_max: 400
#homing_speed: 8
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.58
hold_current: 0.50
stealthchop_threshold: 999999


#####################################################################
# Extruder (adjust rotation_distance for your extruder/gearing)
#####################################################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16

# Starter value ONLY — calibrate (common stock-style range ~30-35mm)
rotation_distance: 33.500

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PC8
sensor_pin: PA0
sensor_type: EPCOS 100K B57560G104F # Standard Creality Thermistor

#control: pid
# Run PID tune for your setup

min_temp: 0
max_temp: 260

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.5
hold_current: 0.35
stealthchop_threshold: 999999


#####################################################################
# Heated bed
#####################################################################

[heater_bed]
heater_pin: PC9
sensor_pin: PC4
sensor_type: ATC Semitec 104GT-2

#control: pid
# Placeholders — run PID tune
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182

min_temp: 0
max_temp: 130


#####################################################################
# Fans (SKR Mini E3 V3.0)
#####################################################################

# Part cooling fan (slicer controlled)
[fan]
pin: PC6

# Nozzle/heatsink fan (auto-on with hotend temperature)
[heater_fan nozzle_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

# Electronics/controller fan (auto-on with bed temperature)
[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0


#####################################################################
# BLTouch (pins from BTT SKR Mini E3 V3.0 reference config)
#####################################################################

[bltouch]
sensor_pin: ^PC14 # OR ^PC14 Have to verify
control_pin: PA1

# These offsets depend on your mount — verify!
# offset = probe_pos - nozzle_pos
x_offset: 44
y_offset: 6

# MUST be calibrated on your printer:
# nozzle_pos = probe_pos - offset
#z_offset: 0.0

# Optional reliability options (uncomment if needed)
# stow_on_each_sample: False
# probe_with_touch_mode: True


[safe_z_home]
home_xy_position: 175, 175
#speed: 80
speed: 10
z_hop: 10
z_hop_speed: 5


#####################################################################
# Bed mesh (tune mesh_min/max for your probe reach with offsets)
#####################################################################

[bed_mesh]
#speed: 120
speed: 50
horizontal_move_z: 5
#mesh_min: 20, 20
#mesh_max: 330, 330
mesh_min: 40, 20
mesh_max: 340, 330
probe_count: 5, 5
algorithm: bicubic


#####################################################################
# Convenience macros
#####################################################################

[gcode_macro G29]
gcode:
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=default


#####################################################################
# Optional: Display (BTT TFT in "emulated 12864" mode)
#####################################################################

#[display]
#lcd_type: emulated_st7920
#spi_software_miso_pin: PD8   # status led, Virtual MISO
#spi_software_mosi_pin: PD6
#spi_software_sclk_pin: PB9
#en_pin: PB8
#encoder_pins: ^PA10, ^PA9
#click_pin: ^!PA15

[output_pin beeper]
pin: PB5

